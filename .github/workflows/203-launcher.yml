name: 203 Launcher CI
on:
  push:
    branches: [main, nightly]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_type:
        type: choice
        options: [nightly, release]
        default: nightly
        description: Release type
      tag:
        type: string
        description: Existing numeric Release tag (release only)
      delete_previous:
        type: choice
        options: ['default', 'true', 'false']
        default: 'default'
        description: Default keeps Releases and replaces previous Nightly
permissions:
  contents: read
concurrency:
  group: cardenza-${{ github.ref }}
  cancel-in-progress: false
jobs:
  cardenza:
    if: github.repository == 'Cardenza-Community/beepbotdx'
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    env:
      PLATFORMIO_CORE_DIR: /tmp/203-launcher-pio
      RELEASE_TYPE: ${{ inputs.release_type || (startsWith(github.ref, 'refs/tags/') && 'release' || 'nightly') }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      DELETE_PREVIOUS: ${{ inputs.delete_previous || 'default' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_type == 'release' && inputs.tag || inputs.release_type == 'nightly' && 'nightly' || github.sha }}
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build and check Cardenza support
        shell: bash
        run: |
          python -m pip install platformio==6.2.0
          python -m platformio run -e cardenza -j4
          python tests/cardenza_nvs_guard.py
      - name: Prepare app-only image and licensing notices
        run: python3 .github/launcher/prepare.py .pio/build/cardenza/firmware.bin .pio/libdeps/cardenza/M5Cardputer/src/M5Cardputer.h
      - name: Upload to Software Launcher
        if: vars.LAUNCHER_APP_ID != '' && (github.ref == 'refs/heads/nightly' || startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch')
        env:
          LAUNCHER_APP_ID: ${{ vars.LAUNCHER_APP_ID }}
          LAUNCHER_APP_TOKEN: ${{ secrets.LAUNCHER_APP_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          : "${LAUNCHER_APP_TOKEN:?Configure the scoped App Token}"
          if [ "$RELEASE_TYPE" = release ]; then
            [[ "$RELEASE_TAG" =~ ^v?[0-9]{1,5}\.[0-9]{1,2}(\.[0-9]{1,2})?$ ]]
          fi
          url="https://launcher-api.203.io/publish"
          if [ "$DELETE_PREVIOUS" != default ]; then
            [[ "$DELETE_PREVIOUS" = true || "$DELETE_PREVIOUS" = false ]]
            url="$url?delete_previous=$DELETE_PREVIOUS"
          fi
          # No redirect following: the App Token stays on the configured publisher.
          curl --fail-with-body --max-time 180 --retry 2 "$url" \
            -H "Authorization: Bearer $LAUNCHER_APP_TOKEN" \
            -H "X-App-Id: $LAUNCHER_APP_ID" -H "X-Target: cardenza" \
            -H "X-Repository: $GITHUB_REPOSITORY" \
            -H "X-Source-Commit: $(git rev-parse HEAD)" \
            -H "X-Release-Tag: $RELEASE_TAG" \
            -F "release_type=$RELEASE_TYPE" \
            -F 'firmware=@.git/launcher-output/Cardenza.bin' \
            -F 'notices=@.git/launcher-output/NOTICES.txt' \
            -o .git/launcher-output/response.json
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('.git/launcher-output/response.json').read_text())
          if result.get('status') not in ('published', 'unchanged'):
              raise SystemExit('Publisher did not confirm publication')
          print(result['status'], result.get('version', ''))
          PY
      - name: Cloud registration pending
        if: vars.LAUNCHER_APP_ID == ''
        run: echo '::notice::Build checked. Configure the registered App ID and scoped App Token to enable publication.'
