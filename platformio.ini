[platformio]
default_envs = m5stack-cardputer

[env:m5stack-cardputer]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

board_build.arduino.memory_type = qio_opi
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio

upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DFASTLED_RMT_BUILTIN_DRIVER=1
    -Isrc
    -Isrc/core
    -Isrc/platform
    -Isrc/views

build_src_filter =
    +<*>
    -<platform_desktop/>

lib_deps =
    m5stack/M5Cardputer
    fastled/FastLED

[env:native]
platform = native
build_flags =
    -Isrc
    -Isrc/core
    -DNATIVE_TEST
build_src_filter =
    +<core/>
    -<core/app.cpp>
test_build_src = true
test_framework = unity

[env:cardenza]
extends = env:m5stack-cardputer
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
board = m5stack-stamps3
board_build.arduino.memory_type = qio_qspi
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.partitions = default_8MB.csv
extra_scripts =
build_flags =
    ${env:m5stack-cardputer.build_flags}
    -DCARDENZA_TARGET=1
    -Wl,--wrap=esp_partition_erase_range
    -Wl,--wrap=_ZN2m511Power_Class5beginEv
    -Wl,--wrap=_ZN2m59M5Unified10_setup_ledEN4lgfx6boards7board_tE

lib_deps =
    m5stack/M5Cardputer@1.1.1
    https://github.com/m5stack/M5Unified.git#8108bfad04a20ff4e57c0751f62dd6fdf6b137a6
    https://github.com/m5stack/M5GFX.git#c64a65e
board_upload.flash_size = 8MB
